name: Profile Stats Cards
description: Generate simple, self-hosted GitHub stats cards (SVG, light and dark) without external services.
author: spidero
branding:
  icon: bar-chart-2
  color: blue

inputs:
  github_user_name:
    description: GitHub username to generate the card for.
    required: true
  cards:
    description: Comma-separated cards to generate (stats, languages) or "all".
    required: false
    default: stats
  output_dir:
    description: Directory where the SVG files are written.
    required: false
    default: dist
  token:
    description: >
      Token used to query the GitHub GraphQL API. The default GITHUB_TOKEN only sees
      public data; use a personal access token (read-only) to include private repos.
    required: false
    default: ${{ github.token }}
  include_private:
    description: >
      "true" to include private repositories where a card supports it (e.g. languages).
      Needs a personal access token in `token`.
    required: false
    default: "false"
  title:
    description: Custom title (applies to every selected card). Each card has its own default.
    required: false
    default: ""
  themes:
    description: Comma-separated list of themes to render (light, dark).
    required: false
    default: light,dark

runs:
  using: composite
  steps:
    - name: Generate stats card
      shell: bash
      # Inputs are passed via env to avoid shell injection
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CARD_USER: ${{ inputs.github_user_name }}
        CARD_OUT: ${{ inputs.output_dir }}
        CARD_TITLE: ${{ inputs.title }}
        CARD_THEMES: ${{ inputs.themes }}
        CARD_CARDS: ${{ inputs.cards }}
        CARD_PRIVATE: ${{ inputs.include_private }}
      run: |
        extra=()
        [ "$CARD_PRIVATE" = "true" ] && extra+=(--include-private)
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m github_cards "$CARD_USER" "$CARD_OUT" \
          --cards "$CARD_CARDS" --title "$CARD_TITLE" --themes "$CARD_THEMES" "${extra[@]}"
