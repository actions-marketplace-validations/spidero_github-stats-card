name: Profile Stats Cards
description: Generate simple, self-hosted GitHub stats cards (SVG, light and dark) without external services.
author: spidero
branding:
  icon: bar-chart-2
  color: blue

inputs:
  github_user_name:
    description: GitHub username to generate the card for.
    required: true
  cards:
    description: Comma-separated cards to generate (stats, languages, streak, org) or "all".
    required: false
    default: stats
  output_dir:
    description: Directory where the SVG files are written.
    required: false
    default: dist
  token:
    description: >
      Token used to query the GitHub GraphQL API. The default GITHUB_TOKEN only sees
      public data; use a personal access token (read-only) to include private repos.
    required: false
    default: ${{ github.token }}
  include_private:
    description: >
      "true" to include private repositories where a card supports it (e.g. languages).
      Needs a personal access token in `token`.
    required: false
    default: "false"
  org:
    description: Organization login for the "org" card (defaults to github_user_name).
    required: false
    default: ""
  colors:
    description: >
      Override theme colors, e.g. "accent=#ff0066,bg=#101010".
      Keys: bg, bg2 (gradient end), border, title, label, value, accent, track.
    required: false
    default: ""
  hide:
    description: >
      Comma-separated items to hide: stats rows (stars, commits, private, prs, issues,
      contributed, repos) and/or language names (e.g. "issues,html,css").
    required: false
    default: ""
  exclude_repos:
    description: Comma-separated repository names to skip (stars, repo count, languages).
    required: false
    default: ""
  exclude_archived:
    description: '"true" skips archived repositories (stars, repo count, languages).'
    required: false
    default: "false"
  show_credit:
    description: '"false" hides the small project link in the bottom-left corner of the cards.'
    required: false
    default: "true"
  title:
    description: Custom title (applies to every selected card). Each card has its own default.
    required: false
    default: ""
  themes:
    description: >
      Comma-separated themes or "all": light, dark, dimmed, transparent, midnight, aurora,
      sunset, forest, mono, high-contrast.
    required: false
    default: light,dark

runs:
  using: composite
  steps:
    - name: Generate stats card
      shell: bash
      # Inputs are passed via env to avoid shell injection
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CARD_USER: ${{ inputs.github_user_name }}
        CARD_OUT: ${{ inputs.output_dir }}
        CARD_TITLE: ${{ inputs.title }}
        CARD_THEMES: ${{ inputs.themes }}
        CARD_CARDS: ${{ inputs.cards }}
        CARD_PRIVATE: ${{ inputs.include_private }}
        CARD_CREDIT: ${{ inputs.show_credit }}
        CARD_HIDE: ${{ inputs.hide }}
        CARD_ORG: ${{ inputs.org }}
        CARD_COLORS: ${{ inputs.colors }}
        CARD_EXCLUDE: ${{ inputs.exclude_repos }}
        CARD_EXCL_ARCHIVED: ${{ inputs.exclude_archived }}
      run: |
        extra=()
        [ "$CARD_PRIVATE" = "true" ] && extra+=(--include-private)
        [ "$CARD_CREDIT" = "false" ] && extra+=(--no-credit)
        [ "$CARD_EXCL_ARCHIVED" = "true" ] && extra+=(--exclude-archived)
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m github_cards "$CARD_USER" "$CARD_OUT" \
          --cards "$CARD_CARDS" --title "$CARD_TITLE" --themes "$CARD_THEMES" \
          --hide "$CARD_HIDE" --exclude-repos "$CARD_EXCLUDE" \
          --org "$CARD_ORG" --colors "$CARD_COLORS" "${extra[@]}"
