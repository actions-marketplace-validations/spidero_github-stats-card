name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run action from this checkout
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          output_dir: dist

      - name: Check output
        run: |
          set -euo pipefail
          for f in dist/github-stats.svg dist/github-stats-dark.svg; do
            grep -q '<svg' "$f" && echo "ok: $f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: card
          path: dist/
