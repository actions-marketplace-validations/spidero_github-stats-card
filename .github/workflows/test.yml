name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily refresh of the example cards shown in README (output branch)
  schedule:
    - cron: "30 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Unit tests (offline, sample data)
        run: python3 -m unittest discover -s tests -t . -v

      - name: Run action from this checkout
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          output_dir: dist
          cards: all
          org: actions
          themes: all

      - name: Check output (every card x theme)
        run: |
          set -euo pipefail
          for card in $(python3 -m github_cards --list | awk '{print $1}'); do
            for f in "dist/github-$card.svg" "dist/github-$card-dark.svg"; do
              grep -q '<svg' "$f" && echo "ok: $f"
            done
          done

      - name: Offline preview from sample data
        run: python3 preview.py && ls preview/

      - uses: actions/upload-artifact@v7
        with:
          name: cards
          path: |
            dist/
            preview/

  reusable:
    # Exercises the reusable workflow end-to-end (pushes to the "output" branch here)
    uses: ./.github/workflows/card.yml
    with:
      cards: all
      org: actions
      themes: all
    permissions:
      contents: write
